[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/engine",
    "crates/backends",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.com/calendar-notifications-modal"

[workspace.dependencies]
cnm-core = { path = "crates/core" }
cnm-store = { path = "crates/store" }
cnm-engine = { path = "crates/engine" }
cnm-backends = { path = "crates/backends" }
cnm-ui = { path = "crates/ui" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
icalendar = "0.16"
regex = "1"
once_cell = "1"
